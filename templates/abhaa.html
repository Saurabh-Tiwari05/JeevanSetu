<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ABHA Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: #f2f2f2;
      color: black;
    }
    .modal, .section {
      display: none;
    }
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center; align-items: center;
      display: flex;
    }
    .modal-content {
      background-color: white;
      padding: 20px;
      border-radius: 6px;
      text-align: center;
      width: 300px;
      color: black;
    }
    .btn {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border: none;
      background-color: #3f51b5;
      color: white;
      border-radius: 4px;
    }
    .container {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      color: black;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    label {
      display: block;
      margin: 8px 0;
      color: black;
    }
    a {
      color: #3f51b5;
      text-decoration: underline;
    }
    .link-btn {
      background-color: gray;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px 0;
      width: 100%;
      border-radius: 4px;
      cursor: not-allowed;
      opacity: 0.6;
      font-size: 16px;
    }
    .link-btn.enabled {
      background-color: #3f51b5;
      cursor: pointer;
      opacity: 1;
    }
    .secondary-btn {
      background: none;
      border: 1px solid #3f51b5;
      color: #3f51b5;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin: 8px 0;
      font-size: 16px;
    }
    .goto-choice-btn {
      background-color: #ff9800;
      color: black;
      border: none;
      padding: 10px 20px;
      margin-top: 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      font-size: 16px;
    }
    .terms-popup {
      display: none;
      background-color: #2196f3;
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 14px;
    }
    #otpSection {
      display: none;
      margin-top: 20px;
    }
    .back-btn {
      background-color: #ff9800;
      margin-top: 15px;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      color: black;
      font-weight: bold;
      width: 100%;
      font-size: 16px;
    }
    .message {
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Modal -->
  <div class="modal" id="choiceModal">
    <div class="modal-content">
      <p>Do you want to Create or Link Health ID?</p>
      <button class="btn" onclick="showSection('link')">LINK</button>
      <button class="btn" onclick="showSection('create')">CREATE</button>
    </div>
  </div>

  <!-- Link ABHA Section -->
  <div class="section" id="linkSection">
    <div class="container">
      <h2>Enter your ABHA address</h2>
      <input type="text" id="abhaAddress" placeholder="Enter Abha Address" /> @abdm

      <label>
        <input type="checkbox" id="linkTerms" /> I agree to the <a href="#">Terms & Conditions</a>
      </label>

      <div id="termsPopup" class="terms-popup">Terms Accepted ✔️</div>

      <button class="link-btn" id="continueLinkBtn" disabled>Continue</button>

      <div class="center">
        <p>Don't have ABHA?</p>
        <button class="btn secondary-btn" id="registerBtn">Register</button>
      </div>

      <button class="goto-choice-btn" onclick="openChoiceModal()">Go to Choice</button>
    </div>
  </div>

  <!-- Create ABHA Section -->
  <div class="section" id="createSection">
    <div class="container">
      <h2>Aadhar Number</h2>
      <input
        type="text"
        id="aadharInput"
        placeholder="Enter 12 digit aadhar number"
        maxlength="12"
        oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,12)"
      />

      <label>
        <input type="checkbox" id="createTerms" /> I agree to the <a href="#">Terms & Conditions</a>
      </label>

      <button class="link-btn" id="continueCreateBtn" disabled>Continue</button>

      <div class="center">
        <button class="secondary-btn" id="createWithMobileBtn">Create Abha With Mobile Number</button>
      </div>

      <button class="goto-choice-btn" onclick="openChoiceModal()">Go to Choice</button>
    </div>
  </div>

  <!-- Mobile + OTP Section -->
  <div class="section" id="mobileOtpSection">
    <div class="container">
      <h2>Create ABHA With Mobile Number</h2>

      <div id="mobileSection">
        <input
          type="text"
          id="mobileInput"
          placeholder="Enter your 10-digit mobile number"
          maxlength="10"
          oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)"
        />
        <button id="sendOtpBtn" disabled>Send OTP</button>
      </div>

      <div id="otpSection">
        <p class="message">OTP sent to your mobile number</p>
        <input
          type="text"
          id="otpInput"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6)"
        />
        <button id="verifyOtpBtn" disabled>Verify OTP & Create ABHA</button>
      </div>

      <button class="back-btn" onclick="backToCreate()">Back to Create</button>
      <button class="goto-choice-btn" onclick="openChoiceModal()">Go to Choice</button>
    </div>
  </div>

  <script>
    // Show modal on load
    window.onload = function () {
      openChoiceModal();
    };

    function openChoiceModal() {
      hideAllSections();
      document.getElementById('choiceModal').style.display = 'flex';
    }

    function hideAllSections() {
      document.getElementById('choiceModal').style.display = 'none';
      document.getElementById('linkSection').style.display = 'none';
      document.getElementById('createSection').style.display = 'none';
      document.getElementById('mobileOtpSection').style.display = 'none';
    }

    function showSection(type) {
      hideAllSections();
      document.getElementById(type === 'link' ? 'linkSection' : 'createSection').style.display = 'block';
    }

    function backToCreate() {
      document.getElementById('mobileOtpSection').style.display = 'none';
      document.getElementById('createSection').style.display = 'block';
      resetMobileOtpSection();
    }

    const validAadharNumbers = ["282216046863", "405437886468", "976331301098"];

    // Link ABHA
    document.getElementById('linkTerms').addEventListener('change', function () {
      const btn = document.getElementById('continueLinkBtn');
      document.getElementById('termsPopup').style.display = this.checked ? 'inline-block' : 'none';
      btn.disabled = !this.checked;
      btn.classList.toggle('enabled', this.checked);
    });

    document.getElementById('continueLinkBtn').addEventListener('click', () => {
      const val = document.getElementById('abhaAddress').value.trim();
      if (val) alert("Your ABHA is linked successfully.");
      else alert("Enter valid ABHA address.");
    });

    // Aadhar ABHA
    document.getElementById('createTerms').addEventListener('change', function () {
      const btn = document.getElementById('continueCreateBtn');
      btn.disabled = !this.checked;
      btn.classList.toggle('enabled', this.checked);
    });

    document.getElementById('continueCreateBtn').addEventListener('click', () => {
      const aadhar = document.getElementById('aadharInput').value.trim();
      if (validAadharNumbers.includes(aadhar)) {
        const abhaId = Math.floor(10000000000000 + Math.random() * 89999999999999) + '@abdm';
        alert(`✅ Your ABHA is created successfully.\n🆔 ABHA ID: ${abhaId}`);
      } else {
        alert("❌ Invalid or unauthorized Aadhar number. Try again with a valid one.");
      }
    });

    // Register link
    document.getElementById('registerBtn').addEventListener('click', () => showSection('create'));

    // Mobile ABHA Flow
    const mobileInput = document.getElementById('mobileInput');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const otpInput = document.getElementById('otpInput');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');

    mobileInput.addEventListener('input', () => {
      sendOtpBtn.disabled = mobileInput.value.length !== 10;
    });

    document.getElementById('createWithMobileBtn').addEventListener('click', () => {
      document.getElementById('createSection').style.display = 'none';
      document.getElementById('mobileOtpSection').style.display = 'block';
      resetMobileOtpSection();
    });

    let generatedOtp = null;

    sendOtpBtn.addEventListener('click', () => {
      // Generate a random 6-digit OTP
      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

      alert(`📱 Simulated SMS:\nYour OTP is ${generatedOtp}`);
      sendOtpBtn.disabled = true;
      mobileInput.disabled = true;
      document.getElementById('otpSection').style.display = 'block';
    });

    otpInput.addEventListener('input', () => {
      verifyOtpBtn.disabled = otpInput.value.length !== 6;
    });

    verifyOtpBtn.addEventListener('click', () => {
      if (otpInput.value === generatedOtp) {
        const abhaId = mobileInput.value + '@abdm';
        alert(`✅ Your ABHA is created successfully.\n🆔 ABHA ID: ${abhaId}`);
        openChoiceModal();
        resetMobileOtpSection();
      } else {
        alert('❌ Incorrect OTP. Please try again.');
      }
    });

    function resetMobileOtpSection() {
      mobileInput.value = '';
      otpInput.value = '';
      mobileInput.disabled = false;
      sendOtpBtn.disabled = true;
      verifyOtpBtn.disabled = true;
      document.getElementById('otpSection').style.display = 'none';
    }
  </script>
</body>
</html>
