<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment - Jeevan Setu</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #00796b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    button {
      width: 100%;
      background-color: #00796b;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #004d40;
    }

    select:disabled {
      background-color: #f5f5f5;
      color: #999;
    }

    .loader {
      text-align: center;
      font-size: 14px;
      color: #888;
      display: none;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Book an Appointment</h2>
    <form method="POST" action="{{ url_for('book_appointment') }}">
      
      <label for="patient_id">Patient ID</label>
      <input type="text" name="patient_id" id="patient_id" required placeholder="Enter your Patient ID">

      <label for="hospital_name">Select Hospital/Clinic</label>
      <select name="hospital_name" id="hospital_select" required>
        <option value="">-- Select Hospital --</option>
        {% for hospital in hospitals %}
          <option value="{{ hospital }}">{{ hospital }}</option>
        {% endfor %}
      </select>

      <label for="specialization">Select Specialization</label>
      <select name="specialization" id="specialization_select" required disabled>
        <option value="">-- Select Specialization --</option>
      </select>

      <label for="doctor_id">Select Doctor</label>
      <select name="doctor_id" id="doctor_select" required disabled>
        <option value="">-- Select Doctor --</option>
      </select>

      <label for="appointment_time">Select Date & Time</label>
      <input type="datetime-local" name="appointment_time" id="appointment_time" required>

      <div class="loader" id="loader">Loading...</div>

      <button type="submit">Confirm Appointment</button>
    </form>
  </div>

  <script>
    const hospitalSelect = document.getElementById('hospital_select');
    const specializationSelect = document.getElementById('specialization_select');
    const doctorSelect = document.getElementById('doctor_select');
    const loader = document.getElementById('loader');

    hospitalSelect.addEventListener('change', function () {
      const hospital = this.value;
      specializationSelect.disabled = true;
      doctorSelect.disabled = true;
      specializationSelect.innerHTML = '<option value="">-- Select Specialization --</option>';
      doctorSelect.innerHTML = '<option value="">-- Select Doctor --</option>';
      
      if (hospital) {
        loader.style.display = 'block';
        fetch(`/get_specializations/${hospital}`)
          .then(response => response.json())
          .then(data => {
            data.specializations.forEach(spec => {
              const option = document.createElement('option');
              option.value = spec;
              option.textContent = spec;
              specializationSelect.appendChild(option);
            });
            specializationSelect.disabled = false;
          })
          .catch(error => {
            console.error('Error fetching specializations:', error);
            alert('Failed to load specializations.');
          })
          .finally(() => {
            loader.style.display = 'none';
          });
      }
    });

    specializationSelect.addEventListener('change', function () {
      const hospital = hospitalSelect.value;
      const specialization = this.value;
      doctorSelect.disabled = true;
      doctorSelect.innerHTML = '<option value="">-- Select Doctor --</option>';
      
      if (hospital && specialization) {
        loader.style.display = 'block';
        fetch(`/get_doctors/${hospital}/${specialization}`)
          .then(response => response.json())
          .then(data => {
            data.doctors.forEach(doc => {
              const option = document.createElement('option');
              option.value = doc.user_id;
              option.textContent = doc.full_name;
              doctorSelect.appendChild(option);
            });
            doctorSelect.disabled = false;
          })
          .catch(error => {
            console.error('Error fetching doctors:', error);
            alert('Failed to load doctors.');
          })
          .finally(() => {
            loader.style.display = 'none';
          });
      }
    });
  </script>
</body>
</html>
