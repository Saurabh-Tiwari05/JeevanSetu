<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Jeevan Setu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f4f9ff;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.3s;
    }

    .register-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 119, 182, 0.2);
      width: 100%;
      max-width: 450px;
      text-align: center;
      position: relative;
      transition: background 0.3s;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #0077b6;
    }

    h2 {
      margin-bottom: 20px;
      color: #0077b6;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-group {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      background-color: #f9f9f9;
      transition: border-color 0.3s;
    }

    .input-group i {
      margin-right: 10px;
      color: #0077b6;
    }

    .input-group input,
    .input-group select {
      border: none;
      outline: none;
      flex: 1;
      background: transparent;
      font-size: 1rem;
    }

    .register-btn {
      background-color: #0077b6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .register-btn:hover {
      background-color: #005f8a;
    }

    .toggle-mode {
      position: absolute;
      top: 15px;
      right: 15px;
      cursor: pointer;
      font-size: 1.2rem;
      color: #0077b6;
    }

    /* Dark Mode */
    body.dark-mode {
      background-color: #1a1a1a;
      color: #eee;
    }

    .dark-mode .register-container {
      background-color: #2a2a2a;
    }

    .dark-mode .input-group {
      background-color: #333;
      border-color: #444;
    }

    .dark-mode .input-group input,
    .dark-mode .input-group select {
      color: #eee;
    }

    .dark-mode .register-btn {
      background-color: #00b4d8;
    }

    .dark-mode .toggle-mode {
      color: #00b4d8;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 30px 20px;
      }
    }
  </style>
  <script>
    function toggleMode() {
      document.body.classList.toggle('dark-mode');
    }

    function toggleRoleFields() {
      const role = document.getElementById('role').value;
      document.getElementById('admin-fields').style.display = (role === 'admin') ? 'block' : 'none';
      document.getElementById('patient-fields').style.display = (role === 'patient') ? 'block' : 'none';
      document.getElementById('doctor-fields').style.display = (role === 'doctor') ? 'block' : 'none';

      // Set required dynamically
      document.querySelectorAll('#patient-fields input').forEach(input => input.required = role === 'patient');
      document.querySelectorAll('#doctor-fields input, #doctor-fields select').forEach(input => input.required = role === 'doctor');
      document.querySelectorAll('#admin-fields select').forEach(select => select.required = role === 'admin');
    }

    window.addEventListener('DOMContentLoaded', () => {
      toggleRoleFields(); // On load
    });
  </script>
</head>
<body>
  <div class="register-container">
    <div class="toggle-mode" onclick="toggleMode()">🌓</div>
    <img src="{{ url_for('static', filename='jeevan-setu-logo.png') }}" alt="Logo" class="logo-img" />
    <h2>Register on Jeevan Setu</h2>
  
    <form method="POST" action="{{ url_for('register') }}">
      <div class="input-group">
        <i>👤</i>
        <input type="text" name="full_name" placeholder="Full Name" maxlength="55" required />
      </div>

      <div class="input-group">
        <i>📞</i>
        <input type="text" name="phone_number" placeholder="Phone Number" maxlength="15" pattern="\d{10,15}" required />
      </div>
      <div class="input-group">
        <i>🧑‍🤝‍🧑</i>
        <select name="gender" id="gender" required >
          <option value=""> Select Gender</option>
          <option value="Male"> Male</option>
          <option value="Female"> Female</option>
          <option value="Other"> Other</option>
        </select>
      </div>
      
      

      <div class="input-group">
        <i>🎭</i>
        <select name="role" id="role" onchange="toggleRoleFields()" required>
          <option value="">Select Role</option>
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="input-group">
        <i>📧</i>
        <input type="email" name="email" placeholder="Email" required />
      </div>

      <div class="input-group">
        <i>🔐</i>
        <input type="password" name="password" placeholder="Password" required />
      </div>

      <div class="input-group">
        <i>🆔</i>
        <input type="text" name="aadhaar_card" placeholder="Aadhaar Card Number" maxlength="12" pattern="\d{12}" required />
      </div>

      <!-- Patient Fields -->
      <div id="patient-fields" style="display: none;">
        <div class="input-group">
          <i>🎂</i>
          <input type="date" name="dob" placeholder="Date of Birth" />
        </div>
        <div class="input-group">
          <i>🏠</i>
          <input type="text" name="address" placeholder="Address" maxlength="100" />
        </div>
      </div>

      <!-- Admin Fields -->
      <div id="admin-fields" style="display: none;">
        <div class="input-group">
          <i>🏥</i>
          <select name="hospital_name">
            <option value="" disabled selected>Select Hospital</option>
            {% for hospital in hospitals %}
              <option value="{{ hospital }}">{{ hospital }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Doctor Fields -->
      <div id="doctor-fields" style="display: none;">
        <div class="input-group">
          <i>💼</i>
          <input type="text" name="specialization" placeholder="Specialization" maxlength="50" />
        </div>
        <br>
        <div class="input-group">
          <i>🏥</i>
          <select name="hospital_name">
            <option value="" disabled selected>Select Hospital</option>
            {% for hospital in hospitals %}
              <option value="{{ hospital }}">{{ hospital }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <button type="submit" class="register-btn">Register</button>
      <div class="link">
        Already have an account? <a href="/login">Login</a><br>
        <a href="/">Back to Home</a>
      </div>
    </form>
  </div>
</body>
</html>
