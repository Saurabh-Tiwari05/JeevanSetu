<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient ID Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 20px auto;
      border: 2px solid #333;
      padding: 20px;
      border-radius: 8px;
      background: #f9f9f9;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    .info p {
      font-size: 1.1em;
      margin: 5px 0;
      text-align: left;
    }
    .image-section {
      margin: 25px 0;
    }
    .image-section h3 {
      margin-bottom: 8px;
    }
    .image-section img {
      border: 1px solid #000;
      padding: 5px;
      background: white;
      max-width: 200px;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Patient ID Card</h1>

  <div class="info">
    <p><strong>Name:</strong> {{ patient.full_name }}</p>
    <p><strong>User ID:</strong> {{ patient.user_id }}</p>
  </div>

  <div class="image-section">
    <h3>QR Code</h3>
    <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" />
  </div>

  <div class="image-section">
    <h3>Barcode</h3>
    <img src="data:image/png;base64,{{ barcode }}" alt="Barcode" />
  </div>
</body>
</html>
