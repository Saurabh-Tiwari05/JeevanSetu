<!DOCTYPE html>
<html>
<head>
    <title>Upload Lab Report - Jeevan Setu</title>
    <style>
        body { font-family: Arial; background-color: #f4f6f8; }
        .container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #00695c; }
        label, input, select {
            display: block;
            width: 100%;
            margin: 12px 0;
        }
        input[type="text"], input[type="file"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #004d40;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Upload Lab Report</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Patient ID:</label>
        <input type="text" name="patient_id" required>

        <label>Patient Name:</label>
        <input type="text" name="patient_name" required>

        <label>Select Report File:</label>
        <input type="file" name="file" required>

        <button type="submit">Upload Report</button>
    </form>
</div>
</body>
</html>
