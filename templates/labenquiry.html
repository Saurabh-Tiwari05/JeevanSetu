<!DOCTYPE html>

  <title>Lab Enquiry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #f0f4ff; }
    header { background-color: #3f51b5; color: white; padding: 1rem; text-align: center; font-size: 1.5rem; position: sticky; top: 0; }
    .search-container { display: flex; align-items: center; justify-content: center; background-color: #e8eaf6; padding: 0.8rem; }
    .search-container input { width: 80%; padding: 0.6rem; border-radius: 0.5rem; border: 1px solid #ccc; font-size: 1rem; }
    .lab-list { padding: 1rem; }
    .lab-item { background-color: white; border-radius: 0.5rem; margin-bottom: 0.8rem; padding: 0.8rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    .lab-info { max-width: 80%; }
    .lab-info p { margin: 0.2rem 0; }
    .lab-info .test-name { font-weight: bold; }
    .lab-price { font-weight: bold; font-size: 1.2rem; color: #0288d1; }
  </style>
</head>

    const labList = document.getElementById('labList');
    const searchInput = document.getElementById('searchInput');

    function displayLabs(filteredLabs) {
      labList.innerHTML = '';
      filteredLabs.forEach(test => {
        const labItem = document.createElement('div');
        labItem.className = 'lab-item';
        labItem.innerHTML = `
          <div class="lab-info">
            <p class="test-name">${test.name}</p>
            <p>Lab Name: ${test.lab}</p>
          </div>
          <div class="lab-price">₹ ${test.price.toFixed(2)}</div>
        `;
        labList.appendChild(labItem);
      });
    }

    displayLabs(labTests);

    searchInput.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = labTests.filter(test => test.name.toLowerCase().includes(keyword));
      displayLabs(filtered);
    });
