<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Jeevan Setu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f4f9ff;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.3s;
    }

    .login-container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 119, 182, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      transition: background 0.3s;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #0077b6;
    }

    h2 {
      margin-bottom: 20px;
      color: #0077b6;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-group {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      background-color: #f9f9f9;
      transition: border-color 0.3s;
    }

    .input-group i {
      margin-right: 10px;
      color: #0077b6;
    }

    .input-group input {
      border: none;
      outline: none;
      flex: 1;
      background: transparent;
      font-size: 1rem;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .options a {
      text-decoration: none;
      color: #0077b6;
    }

    .login-btn {
      background-color: #0077b6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background-color: #005f8a;
    }

    .role-select {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #f9f9f9;
    }

    .toggle-mode {
      position: absolute;
      top: 15px;
      right: 15px;
      cursor: pointer;
      font-size: 1.2rem;
      color: #0077b6;
    }

    /* Dark Mode */
    body.dark-mode {
      background-color: #1a1a1a;
      color: #eee;
    }

    .dark-mode .login-container {
      background-color: #2a2a2a;
    }

    .dark-mode .input-group {
      background-color: #333;
      border-color: #444;
    }

    .dark-mode .input-group input {
      color: #eee;
    }

    .dark-mode .login-btn {
      background-color: #00b4d8;
    }

    .dark-mode .toggle-mode {
      color: #00b4d8;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
  <script>
    function toggleMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>
</head>
<body>
  <div class="login-container">
    <div class="toggle-mode" onclick="toggleMode()">🌓</div>
    <img src="{{ url_for('static', filename='jeevan-setu-logo.png') }}" alt="Logo" class="logo-img" />
    <h2>Login to Jeevan Setu</h2>
    <form method="POST" action="{{ url_for('login') }}">
      <div class="role-select">
        <label for="role">Select Role:</label>
        <select name="role" id="role" required>
          <option value="admin">Admin</option>
          <option value="doctor">Doctor</option>
          <option value="patient">Patient</option>
        </select>
      </div>
      <div class="input-group">
        <i>🔒</i>
        <input type="text" name="aadhaar_card" placeholder="Aadhaar Number" required />
      </div>
      <div class="input-group">
        <i>🔑</i>
        <input type="password" name="password" placeholder="Password" required />
      </div>
      <div class="options">
        <label><input type="checkbox" name="remember" /> Remember Me</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="login-btn">Login</button>
      <a href="{{ url_for('register') }}">Don't have an account? Register</a>
      <a href="{{ url_for('home') }}">← Back to Home</a>
    </form>
  </div>
</body>
</html>
